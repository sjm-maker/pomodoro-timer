<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Pomodoro | 45m Ambient Focus Timer</title>

  <!-- SEO & Metadata -->
  <meta name="description" content="A minimalist dark-mode 45-minute countdown timer featuring continuous hue-shifting radial gradients, animated SVG backdrops, and procedural ambient sound synthesis.">
  <meta name="theme-color" content="#07070d">

  <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sjm-maker.github.io/pomodoro-timer/">

  <meta property="og:description" content="45-minute focus countdown timer with procedural ambient noisescapes, rhythmic clock ticks, and calm organic gradients.">
  <meta property="og:image" content="https://sjm-maker.github.io/pomodoro-timer/preview.png">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="sjm-maker.github.io">
  <meta property="twitter:url" content="https://sjm-maker.github.io/pomodoro-timer/">
  <meta name="twitter:title" content="Zenith Pomodoro — Ambient Deep Focus Timer">
  <meta name="twitter:description" content="45-minute focus countdown timer with procedural ambient noisescapes, rhythmic clock ticks, and calm organic gradients.">
  <meta name="twitter:image" content="https://sjm-maker.github.io/pomodoro-timer/preview.png">

  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%2307070d'/><circle cx='32' cy='32' r='24' fill='none' stroke='url(%23grad)' stroke-width='4' stroke-dasharray='100 50'/><circle cx='32' cy='32' r='5' fill='%23ec4899'/><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='50%25' stop-color='%23ec4899'/><stop offset='100%25' stop-color='%2306b6d4'/></linearGradient></defs></svg>">

  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07070d;
      --card-bg: rgba(18, 18, 28, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f0f0f5;
      --text-muted: #8e8ea6;
      --accent-1: #6366f1;
      --accent-2: #ec4899;
      --accent-3: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    /* Calming Animated SVG Background */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }

    .ambient-svg {
      width: 100%;
      height: 100%;
    }

    @keyframes driftOrb1 {
      0%, 100% { cx: 20%; cy: 25%; r: 24%; }
      50% { cx: 32%; cy: 45%; r: 28%; }
    }
    @keyframes driftOrb2 {
      0%, 100% { cx: 80%; cy: 75%; r: 30%; }
      50% { cx: 68%; cy: 60%; r: 25%; }
    }
    @keyframes driftOrb3 {
      0%, 100% { cx: 65%; cy: 20%; r: 22%; }
      50% { cx: 45%; cy: 35%; r: 26%; }
    }
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb-1 { animation: driftOrb1 26s ease-in-out infinite alternate; }
    .orb-2 { animation: driftOrb2 32s ease-in-out infinite alternate; }
    .orb-3 { animation: driftOrb3 28s ease-in-out infinite alternate; }
    .cosmic-ring {
      transform-origin: 50% 50%;
      animation: slowSpin 140s linear infinite;
    }

    /* Main Container */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Header */
    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Hue Shifting Radial Clock Face */
    @keyframes hueRotateRing {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 24px rgba(99, 102, 241, 0.45)); }
      50% { filter: hue-rotate(180deg) drop-shadow(0 0 32px rgba(236, 72, 153, 0.5)); }
      100% { filter: hue-rotate(360deg) drop-shadow(0 0 24px rgba(99, 102, 241, 0.45)); }
    }

    .clock-stage {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock-svg-wrapper {
      position: absolute;
      inset: 0;
      animation: hueRotateRing 24s linear infinite;
      transition: filter 0.5s ease;
    }

    .clock-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .track-bg {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 8;
      fill: none;
    }

    .track-progress {
      stroke-width: 9;
      stroke-linecap: round;
      fill: none;
      transition: stroke-dashoffset 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-glow {
      stroke-width: 16;
      stroke-linecap: round;
      fill: none;
      opacity: 0.35;
      filter: blur(6px);
      transition: stroke-dashoffset 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .clock-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(14, 14, 25, 0.85) 0%, rgba(7, 7, 13, 0.95) 100%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 10px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .time-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.8rem;
      font-weight: 300;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
    }

    .timer-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-tick-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6366f1;
      opacity: 0.3;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .live-tick-dot.pulse {
      opacity: 1;
      transform: scale(1.6);
      box-shadow: 0 0 10px #6366f1;
    }

    /* Duration Presets */
    .presets-row {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .preset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .preset-btn.active {
      background: rgba(99, 102, 241, 0.25);
      color: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.5);
    }

    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: white;
      border: none;
      padding: 14px 38px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
      filter: brightness(1.08);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: rotate(-30deg);
    }

    /* Ambient Sound Mixer Panel */
    .soundboard-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .soundboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .soundboard-header h3 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .master-vol-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .master-vol-wrap input[type="range"] {
      width: 90px;
    }

    .ambient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .sound-item {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .sound-item.active {
      background: rgba(99, 102, 241, 0.08);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .sound-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sound-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sound-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .sound-item.active .sound-icon {
      background: rgba(99, 102, 241, 0.25);
      color: #818cf8;
    }

    .sound-labels {
      display: flex;
      flex-direction: column;
    }

    .sound-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .sound-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .25s;
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #6366f1;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Custom Sliders */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(129, 140, 248, 0.6);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Footer Shortcut indicator */
    footer {
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.3);
      display: flex;
      gap: 16px;
      letter-spacing: 0.05em;
    }
    footer kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- Calming Animated SVG Background -->
  <div class="bg-canvas">
    <svg class="ambient-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#07070d" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#db2777" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#07070d" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="grad3" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#0891b2" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#07070d" stop-opacity="0" />
        </radialGradient>
      </defs>

      <circle class="orb-1" cx="20%" cy="25%" r="24%" fill="url(#grad1)" />
      <circle class="orb-2" cx="80%" cy="75%" r="30%" fill="url(#grad2)" />
      <circle class="orb-3" cx="65%" cy="20%" r="22%" fill="url(#grad3)" />

      <!-- Subtle rotating constellation guide -->
      <g class="cosmic-ring" opacity="0.12">
        <circle cx="50%" cy="50%" r="380" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 12" fill="none" />
        <circle cx="50%" cy="50%" r="480" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 24" fill="none" />
      </g>
    </svg>
  </div>

  <main class="app-shell">
    <header>
      <div class="brand-title">
        <span></span> Deep Focus Mode
      </div>
    </header>

    <!-- Radial Glowing Hue-Shifting Clock Face -->
    <div class="clock-stage">
      <div class="clock-svg-wrapper">
        <svg class="clock-svg" viewBox="0 0 320 320">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1" />
              <stop offset="50%" stop-color="#ec4899" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
          <circle class="track-bg" cx="160" cy="160" r="140"></circle>
          <circle id="trackGlow" class="track-glow" cx="160" cy="160" r="140" stroke="url(#ringGradient)"></circle>
          <circle id="trackProgress" class="track-progress" cx="160" cy="160" r="140" stroke="url(#ringGradient)"></circle>
        </svg>
      </div>

      <div class="clock-center">
        <div class="time-digits" id="timeDisplay">45:00</div>
        <div class="timer-caption">
          <span class="live-tick-dot" id="liveTickDot"></span>
          <span id="sessionStatus">Ready</span>
        </div>
      </div>
    </div>

    <!-- Quick Presets -->
    <div class="presets-row">
      <button class="preset-btn" data-minutes="15">15m</button>
      <button class="preset-btn" data-minutes="25">25m</button>
      <button class="preset-btn active" data-minutes="45">45m Focus</button>
      <button class="preset-btn" data-minutes="60">60m</button>
    </div>

    <!-- Controls -->
    <div class="controls-row">
      <button class="btn-primary" id="toggleBtn">
        <svg id="playIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="toggleText">Start Focus</span>
      </button>
      <button class="btn-secondary" id="resetBtn" title="Reset Session">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>

    <!-- Ambient Sound Mixer -->
    <section class="soundboard-card">
      <div class="soundboard-header">
        <h3>Sound Environment</h3>
        <div class="master-vol-wrap">
          <span>Master</span>
          <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>

      <div class="ambient-grid">
        <!-- Mechanical Clock (Default On) -->
        <div class="sound-item active" id="card-clock">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">⏱️</div>
              <div class="sound-labels">
                <div class="sound-title">Clock Tick</div>
                <div class="sound-desc">Soft rhythmic pulse</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-clock" checked>
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-clock" min="0" max="1" step="0.01" value="0.6">
        </div>

        <!-- Brownian Noise -->
        <div class="sound-item" id="card-brown">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🌊</div>
              <div class="sound-labels">
                <div class="sound-title">Brownian Drift</div>
                <div class="sound-desc">Deep low-frequency roar</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-brown">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-brown" min="0" max="1" step="0.01" value="0.45">
        </div>

        <!-- Rain -->
        <div class="sound-item" id="card-rain">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🌧️</div>
              <div class="sound-labels">
                <div class="sound-title">Gentle Rain</div>
                <div class="sound-desc">Soft window rainfall</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-rain">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.5">
        </div>

        <!-- Hearth -->
        <div class="sound-item" id="card-fire">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🪵</div>
              <div class="sound-labels">
                <div class="sound-title">Cozy Hearth</div>
                <div class="sound-desc">Warm fire & embers</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-fire">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-fire" min="0" max="1" step="0.01" value="0.4">
        </div>

        <!-- Tibetan Singing Drone -->
        <div class="sound-item" id="card-drone">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🧘</div>
              <div class="sound-labels">
                <div class="sound-title">Singing Drone</div>
                <div class="sound-desc">108Hz harmonic bowl</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-drone">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-drone" min="0" max="1" step="0.01" value="0.35">
        </div>
      </div>
    </section>

    <footer>
      <span><kbd>Space</kbd> Start / Pause</span>
      <span><kbd>R</kbd> Reset</span>
    </footer>
  </main>

  <script>
    /* Web Audio Synthesis Engine (Pure Web Audio - No Assets Needed) */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isAudioReady = false;

        this.sounds = {
          clock: { gain: null, enabled: true, userVol: 0.6 },
          brown: { gain: null, node: null, enabled: false, userVol: 0.45 },
          rain: { gain: null, node: null, enabled: false, userVol: 0.5 },
          fire: { gain: null, node: null, enabled: false, userVol: 0.4 },
          drone: { gain: null, nodes: [], enabled: false, userVol: 0.35 }
        };
      }

      init() {
        if (this.isAudioReady) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        for (let key in this.sounds) {
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(this.sounds[key].enabled ? this.sounds[key].userVol : 0, this.ctx.currentTime);
          g.connect(this.masterGain);
          this.sounds[key].gain = g;
        }

        this.isAudioReady = true;
      }

      setMasterVolume(val) {
        if (!this.isAudioReady) return;
        this.masterGain.gain.setTargetAtTime(val, this.ctx.currentTime, 0.05);
      }

      setTrackVolume(key, val) {
        this.sounds[key].userVol = val;
        if (!this.isAudioReady || !this.sounds[key].enabled) return;
        this.sounds[key].gain.gain.setTargetAtTime(val, this.ctx.currentTime, 0.05);
      }

      toggleTrack(key, isRunningTimer) {
        const item = this.sounds[key];
        item.enabled = !item.enabled;

        if (this.isAudioReady) {
          const targetVol = item.enabled ? item.userVol : 0;
          item.gain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.08);

          if (item.enabled && isRunningTimer) {
            this.startGenerator(key);
          } else if (!item.enabled) {
            this.stopGenerator(key);
          }
        }
        return item.enabled;
      }

      startActiveGenerators() {
        if (!this.isAudioReady) this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        for (let key in this.sounds) {
          if (this.sounds[key].enabled) {
            this.startGenerator(key);
            this.sounds[key].gain.gain.setTargetAtTime(this.sounds[key].userVol, this.ctx.currentTime, 0.1);
          }
        }
      }

      pauseGenerators() {
        if (!this.isAudioReady) return;
        for (let key in this.sounds) {
          if (key !== 'clock') {
            this.stopGenerator(key);
          }
        }
      }

      startGenerator(key) {
        if (key === 'brown' && !this.sounds.brown.node) this.createBrownian();
        if (key === 'rain' && !this.sounds.rain.node) this.createRain();
        if (key === 'fire' && !this.sounds.fire.node) this.createFire();
        if (key === 'drone' && this.sounds.drone.nodes.length === 0) this.createDrone();
      }

      stopGenerator(key) {
        if (key === 'drone') {
          this.sounds.drone.nodes.forEach(n => {
            try { n.stop(); n.disconnect(); } catch (e) {}
          });
          this.sounds.drone.nodes = [];
          return;
        }
        if (this.sounds[key] && this.sounds[key].node) {
          try {
            this.sounds[key].node.stop();
            this.sounds[key].node.disconnect();
          } catch(e) {}
          this.sounds[key].node = null;
        }
      }

      /* Resonant Mechanical Clock Tick Synthesis */
      playTick(isEven) {
        if (!this.isAudioReady || !this.sounds.clock.enabled) return;

        const osc = this.ctx.createOscillator();
        const tickGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.frequency.setValueAtTime(isEven ? 1320 : 980, this.ctx.currentTime);
        osc.type = 'triangle';

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isEven ? 1400 : 1050, this.ctx.currentTime);
        filter.Q.setValueAtTime(10, this.ctx.currentTime);

        const now = this.ctx.currentTime;
        tickGain.gain.setValueAtTime(0.0001, now);
        tickGain.gain.exponentialRampToValueAtTime(0.4, now + 0.003);
        tickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.038);

        osc.connect(filter);
        filter.connect(tickGain);
        tickGain.connect(this.sounds.clock.gain);

        osc.start(now);
        osc.stop(now + 0.04);
      }

      /* Procedural Brownian Noise Generator */
      createBrownian() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 3.5;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 350;

        whiteNoise.connect(lp);
        lp.connect(this.sounds.brown.gain);
        whiteNoise.start();
        this.sounds.brown.node = whiteNoise;
      }

      /* Procedural Rain Generator */
      createRain() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;

        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          output[i] = (b0 + b1 + b2) * 0.22;
        }

        const rainSource = this.ctx.createBufferSource();
        rainSource.buffer = noiseBuffer;
        rainSource.loop = true;

        const band = this.ctx.createBiquadFilter();
        band.type = 'bandpass';
        band.frequency.value = 1100;
        band.Q.value = 0.8;

        rainSource.connect(band);
        band.connect(this.sounds.rain.gain);
        rainSource.start();
        this.sounds.rain.node = rainSource;
      }

      /* Procedural Cozy Fireplace Crackle */
      createFire() {
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const crackle = Math.random() < 0.002 ? (Math.random() * 2 - 1) * 0.9 : 0;
          const rustle = (Math.random() * 2 - 1) * 0.02;
          data[i] = crackle + rustle;
        }

        const src = this.ctx.createBufferSource();
        src.buffer = buffer;
        src.loop = true;

        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 2400;

        src.connect(lp);
        lp.connect(this.sounds.fire.gain);
        src.start();
        this.sounds.fire.node = src;
      }

      /* Tibetan 108Hz Singing Drone */
      createDrone() {
        const freqs = [108, 216.2, 324.5];
        this.sounds.drone.nodes = [];

        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          subGain.gain.setValueAtTime(idx === 0 ? 0.35 : 0.12, this.ctx.currentTime);
          osc.connect(subGain);
          subGain.connect(this.sounds.drone.gain);
          osc.start();
          this.sounds.drone.nodes.push(osc);
        });
      }

      /* Timer Completion Chime */
      playCompletionChime() {
        if (!this.isAudioReady) return;
        const chimeNotes = [528, 660, 792, 1056];
        chimeNotes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;

          const startTime = this.ctx.currentTime + (i * 0.16);
          g.gain.setValueAtTime(0.001, startTime);
          g.gain.exponentialRampToValueAtTime(0.28, startTime + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, startTime + 2.2);

          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(startTime);
          osc.stop(startTime + 2.3);
        });
      }
    }

    /* Timer & UI Controller */
    const audio = new AudioEngine();

    const RADIUS = 140;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    let totalDuration = 45 * 60;
    let remainingSeconds = totalDuration;
    let timerId = null;
    let isRunning = false;
    let tickFlip = false;

    // Elements
    const timeDisplay = document.getElementById('timeDisplay');
    const trackProgress = document.getElementById('trackProgress');
    const trackGlow = document.getElementById('trackGlow');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');
    const liveTickDot = document.getElementById('liveTickDot');
    const sessionStatus = document.getElementById('sessionStatus');
    const presetBtns = document.querySelectorAll('.preset-btn');

    // Init SVG Circle strokes
    trackProgress.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
    trackGlow.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;

    function updateProgressVisual() {
      const fraction = remainingSeconds / totalDuration;
      const offset = CIRCUMFERENCE * (1 - fraction);
      trackProgress.style.strokeDashoffset = offset;
      trackGlow.style.strokeDashoffset = offset;

      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      document.title = `${timeDisplay.textContent} • Deep Focus`;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      audio.startActiveGenerators();
      isRunning = true;
      toggleText.textContent = 'Pause';
      sessionStatus.textContent = 'Focusing';
      playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

      timerId = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateProgressVisual();

          tickFlip = !tickFlip;
          audio.playTick(tickFlip);
          liveTickDot.classList.add('pulse');
          setTimeout(() => liveTickDot.classList.remove('pulse'), 120);
        } else {
          completeTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      audio.pauseGenerators();
      toggleText.textContent = 'Resume';
      sessionStatus.textContent = 'Paused';
      playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalDuration;
      toggleText.textContent = 'Start Focus';
      sessionStatus.textContent = 'Ready';
      updateProgressVisual();
    }

    function completeTimer() {
      pauseTimer();
      sessionStatus.textContent = 'Completed!';
      audio.playCompletionChime();
    }

    // Presets
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mins = parseInt(btn.dataset.minutes, 10);
        totalDuration = mins * 60;
        resetTimer();
      });
    });

    toggleBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleTimer();
      } else if (e.code === 'KeyR') {
        resetTimer();
      }
    });

    // Soundboard Controls Bindings
    document.getElementById('masterVolume').addEventListener('input', (e) => {
      audio.setMasterVolume(parseFloat(e.target.value));
    });

    const soundKeys = ['clock', 'brown', 'rain', 'fire', 'drone'];
    soundKeys.forEach(key => {
      const toggle = document.getElementById(`toggle-${key}`);
      const vol = document.getElementById(`vol-${key}`);
      const card = document.getElementById(`card-${key}`);

      toggle.addEventListener('change', () => {
        const state = audio.toggleTrack(key, isRunning);
        card.classList.toggle('active', state);
      });

      vol.addEventListener('input', (e) => {
        audio.setTrackVolume(key, parseFloat(e.target.value));
      });
    });

    // Initial render
    updateProgressVisual();
  </script>
</body>
</html>
