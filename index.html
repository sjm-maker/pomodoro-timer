<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Pomodoro | 45m Ocean Focus Timer</title>

  <!-- SEO & Social Preview Tags -->
  <meta name="description" content="A minimalist dark-mode 45-minute countdown timer with ambient soundscapes and continuous multi-layered ambient SVG ocean waves.">
  <meta name="theme-color" content="#030712">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sjm-maker.github.io/pomodoro-timer/">
  <meta property="og:title" content="Zenith Pomodoro — Ambient Ocean Focus Timer">
  <meta property="og:description" content="45-minute focus countdown timer with procedural ambient noisescapes, rhythmic clock ticks, and an undulating layered ocean backdrop.">
  <meta property="og:image" content="https://sjm-maker.github.io/pomodoro-timer/preview.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="sjm-maker.github.io">
  <meta property="twitter:url" content="https://sjm-maker.github.io/pomodoro-timer/">
  <meta name="twitter:title" content="Zenith Pomodoro — Ambient Ocean Focus Timer">
  <meta name="twitter:description" content="45-minute focus countdown timer with procedural ambient noisescapes, rhythmic clock ticks, and an undulating layered ocean backdrop.">
  <meta name="twitter:image" content="https://sjm-maker.github.io/pomodoro-timer/preview.png">

  <!-- Crisp Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23030712'/><circle cx='32' cy='32' r='24' fill='none' stroke='url(%23grad)' stroke-width='4' stroke-dasharray='100 50'/><circle cx='32' cy='32' r='5' fill='%2306b6d4'/><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='50%25' stop-color='%2306b6d4'/><stop offset='100%25' stop-color='%2310b981'/></linearGradient></defs></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(10, 16, 30, 0.52);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-highlight: rgba(255, 255, 255, 0.16);
      --text: #f0f4fc;
      --text-muted: #8391af;
      --accent-1: #6366f1;
      --accent-2: #06b6d4;
      --accent-3: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 36px 16px;
    }

    /* Ambient Ocean SVG Scenery */
    .ocean-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #0a1128 0%, #030712 90%);
    }

    .ocean-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 70vh;
      min-height: 440px;
    }

    /* Harmonic Wave Oscillations */
    @keyframes waveRoll1 {
      0% { transform: translateX(0) translateZ(0) scaleY(1); }
      50% { transform: translateX(-25%) translateZ(0) scaleY(1.08); }
      100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
    }
    @keyframes waveRoll2 {
      0% { transform: translateX(0) translateZ(0) scaleY(1.05); }
      50% { transform: translateX(-30%) translateZ(0) scaleY(0.92); }
      100% { transform: translateX(-50%) translateZ(0) scaleY(1.05); }
    }
    @keyframes waveRoll3 {
      0% { transform: translateX(-40%) translateZ(0) scaleY(0.95); }
      50% { transform: translateX(-15%) translateZ(0) scaleY(1.1); }
      100% { transform: translateX(-40%) translateZ(0) scaleY(0.95); }
    }
    @keyframes waveRoll4 {
      0% { transform: translateX(-10%) translateZ(0) scaleY(1); }
      50% { transform: translateX(-35%) translateZ(0) scaleY(1.15); }
      100% { transform: translateX(-10%) translateZ(0) scaleY(1); }
    }

    .wave-layer-1 {
      animation: waveRoll1 28s ease-in-out infinite;
      opacity: 0.35;
    }
    .wave-layer-2 {
      animation: waveRoll2 22s ease-in-out infinite;
      opacity: 0.45;
    }
    .wave-layer-3 {
      animation: waveRoll3 17s ease-in-out infinite;
      opacity: 0.65;
    }
    .wave-layer-4 {
      animation: waveRoll4 13s ease-in-out infinite;
      opacity: 0.85;
    }

    /* Ambient Hue Shimmer across the Water */
    @keyframes oceanColorDrift {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(35deg); }
      100% { filter: hue-rotate(0deg); }
    }

    .ocean-color-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      animation: oceanColorDrift 25s ease-in-out infinite;
    }

    /* Subtle Bioluminescent Sky Particle Glows */
    .sky-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 550px;
      height: 350px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, rgba(99, 102, 241, 0.12) 40%, transparent 70%);
      filter: blur(40px);
    }

    /* Refractive Glass Card */
    .glass-monolith {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      padding: 38px 36px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      border-radius: 36px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(48px) saturate(190%);
      -webkit-backdrop-filter: blur(48px) saturate(190%);
      box-shadow: 
        0 30px 80px -15px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 1px var(--card-highlight),
        inset 0 -1px 1px rgba(0, 0, 0, 0.4);
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 8px #06b6d4;
    }

    /* Radial Clock Face */
    @keyframes hueRotateRing {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 20px rgba(6, 182, 212, 0.45)); }
      50% { filter: hue-rotate(180deg) drop-shadow(0 0 28px rgba(99, 102, 241, 0.5)); }
      100% { filter: hue-rotate(360deg) drop-shadow(0 0 20px rgba(6, 182, 212, 0.45)); }
    }

    .clock-stage {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock-svg-wrapper {
      position: absolute;
      inset: 0;
      animation: hueRotateRing 24s linear infinite;
    }

    .clock-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .track-bg {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 8;
      fill: none;
    }

    .track-progress {
      stroke-width: 9;
      stroke-linecap: round;
      fill: none;
      transition: stroke-dashoffset 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-glow {
      stroke-width: 16;
      stroke-linecap: round;
      fill: none;
      opacity: 0.35;
      filter: blur(6px);
      transition: stroke-dashoffset 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .clock-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(12, 20, 36, 0.75) 0%, rgba(4, 8, 18, 0.92) 100%);
      width: 236px;
      height: 236px;
      border-radius: 50%;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.85), 0 8px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    .time-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.4rem;
      font-weight: 300;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .timer-caption {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-tick-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #06b6d4;
      opacity: 0.3;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .live-tick-dot.pulse {
      opacity: 1;
      transform: scale(1.6);
      box-shadow: 0 0 10px #06b6d4;
    }

    /* Presets */
    .presets-row {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.035);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .preset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .preset-btn.active {
      background: rgba(6, 182, 212, 0.25);
      color: #ffffff;
      border: 1px solid rgba(6, 182, 212, 0.5);
    }

    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      color: white;
      border: none;
      padding: 13px 36px;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.35);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(2, 132, 199, 0.5);
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: rotate(-30deg);
    }

    /* Ambient Mixer Subpanel */
    .soundboard-section {
      width: 100%;
      background: rgba(6, 11, 22, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 18px 20px;
    }

    .soundboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .soundboard-header h3 {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .master-vol-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .master-vol-wrap input[type="range"] {
      width: 80px;
    }

    .ambient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .sound-item {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .sound-item.active {
      background: rgba(6, 182, 212, 0.1);
      border-color: rgba(6, 182, 212, 0.35);
    }

    .sound-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sound-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sound-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .sound-item.active .sound-icon {
      background: rgba(6, 182, 212, 0.25);
      color: #38bdf8;
    }

    .sound-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    .sound-desc {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .25s;
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #06b6d4;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Custom Sliders */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Footer */
    footer {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.3);
      display: flex;
      gap: 16px;
      letter-spacing: 0.05em;
    }
    footer kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- Ambient Multi-Layered Moving SVG Ocean -->
  <div class="ocean-stage">
    <div class="sky-glow"></div>
    <div class="ocean-color-wrap">
      <svg class="ocean-svg" viewBox="0 0 1440 600" preserveAspectRatio="none">
        <defs>
          <linearGradient id="oceanGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#030712" stop-opacity="1" />
          </linearGradient>
          <linearGradient id="oceanGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0e7490" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#021427" stop-opacity="1" />
          </linearGradient>
          <linearGradient id="oceanGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#020c1b" stop-opacity="1" />
          </linearGradient>
          <linearGradient id="oceanGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#030712" stop-opacity="1" />
          </linearGradient>
        </defs>

        <!-- Deep Distant Swell (Layer 1) -->
        <g class="wave-layer-1">
          <path fill="url(#oceanGrad1)" d="M0,192 C240,140 480,240 720,180 C960,120 1200,210 1440,160 C1680,110 1920,240 2160,180 C2400,120 2640,210 2880,170 L2880,600 L0,600 Z"/>
        </g>

        <!-- Midground Ocean Layer (Layer 2) -->
        <g class="wave-layer-2">
          <path fill="url(#oceanGrad2)" d="M0,240 C320,170 540,290 840,220 C1140,150 1320,270 1620,210 C1920,150 2200,270 2520,200 C2740,140 2820,240 2880,220 L2880,600 L0,600 Z"/>
        </g>

        <!-- Dynamic Tidal Layer (Layer 3) -->
        <g class="wave-layer-3">
          <path fill="url(#oceanGrad3)" d="M0,280 C200,230 460,320 760,260 C1060,200 1280,310 1560,250 C1840,190 2120,300 2420,240 C2640,190 2760,270 2880,250 L2880,600 L0,600 Z"/>
        </g>

        <!-- Foreground Bioluminescent Wave Crest (Layer 4) -->
        <g class="wave-layer-4">
          <path fill="url(#oceanGrad4)" d="M0,340 C180,300 380,380 620,330 C860,280 1100,370 1380,310 C1660,250 1940,360 2220,310 C2500,260 2720,330 2880,320 L2880,600 L0,600 Z"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Unified Refractive Glass Card Monolith -->
  <main class="glass-monolith">
    <header>
      <div class="brand-title">
        <span></span> Deep Focus Mode
      </div>
    </header>

    <!-- Glowing Hue Shifting Radial Clock Face -->
    <div class="clock-stage">
      <div class="clock-svg-wrapper">
        <svg class="clock-svg" viewBox="0 0 320 320">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#06b6d4" />
              <stop offset="50%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#10b981" />
            </linearGradient>
          </defs>
          <circle class="track-bg" cx="160" cy="160" r="140"></circle>
          <circle id="trackGlow" class="track-glow" cx="160" cy="160" r="140" stroke="url(#ringGradient)"></circle>
          <circle id="trackProgress" class="track-progress" cx="160" cy="160" r="140" stroke="url(#ringGradient)"></circle>
        </svg>
      </div>

      <div class="clock-center">
        <div class="time-digits" id="timeDisplay">45:00</div>
        <div class="timer-caption">
          <span class="live-tick-dot" id="liveTickDot"></span>
          <span id="sessionStatus">Ready</span>
        </div>
      </div>
    </div>

    <!-- Duration Presets -->
    <div class="presets-row">
      <button class="preset-btn" data-minutes="15">15m</button>
      <button class="preset-btn" data-minutes="25">25m</button>
      <button class="preset-btn active" data-minutes="45">45m Focus</button>
      <button class="preset-btn" data-minutes="60">60m</button>
    </div>

    <!-- Controls -->
    <div class="controls-row">
      <button class="btn-primary" id="toggleBtn">
        <svg id="playIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="toggleText">Start Focus</span>
      </button>
      <button class="btn-secondary" id="resetBtn" title="Reset Session">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>

    <!-- Ambient Soundboard Sub-section -->
    <section class="soundboard-section">
      <div class="soundboard-header">
        <h3>Sound Environment</h3>
        <div class="master-vol-wrap">
          <span>Master</span>
          <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>

      <div class="ambient-grid">
        <!-- Mechanical Clock (Default On) -->
        <div class="sound-item active" id="card-clock">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">⏱️</div>
              <div>
                <div class="sound-title">Clock Tick</div>
                <div class="sound-desc">Soft rhythmic pulse</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-clock" checked>
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-clock" min="0" max="1" step="0.01" value="0.6">
        </div>

        <!-- Brownian Noise -->
        <div class="sound-item" id="card-brown">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🌊</div>
              <div>
                <div class="sound-title">Brownian Drift</div>
                <div class="sound-desc">Deep low-frequency roar</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-brown">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-brown" min="0" max="1" step="0.01" value="0.45">
        </div>

        <!-- Rain -->
        <div class="sound-item" id="card-rain">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🌧️</div>
              <div>
                <div class="sound-title">Gentle Rain</div>
                <div class="sound-desc">Soft window rainfall</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-rain">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.5">
        </div>

        <!-- Hearth -->
        <div class="sound-item" id="card-fire">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🪵</div>
              <div>
                <div class="sound-title">Cozy Hearth</div>
                <div class="sound-desc">Warm fire & embers</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-fire">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-fire" min="0" max="1" step="0.01" value="0.4">
        </div>

        <!-- Tibetan Singing Drone -->
        <div class="sound-item" id="card-drone">
          <div class="sound-item-top">
            <div class="sound-info">
              <div class="sound-icon">🧘</div>
              <div>
                <div class="sound-title">Singing Drone</div>
                <div class="sound-desc">108Hz harmonic bowl</div>
              </div>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-drone">
              <span class="slider"></span>
            </label>
          </div>
          <input type="range" id="vol-drone" min="0" max="1" step="0.01" value="0.35">
        </div>
      </div>
    </section>

    <footer>
      <span><kbd>Space</kbd> Start / Pause</span>
      <span><kbd>R</kbd> Reset</span>
    </footer>
  </main>

  <script>
    /* Procedural Web Audio Engine */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isAudioReady = false;

        this.sounds = {
          clock: { gain: null, enabled: true, userVol: 0.6 },
          brown: { gain: null, node: null, enabled: false, userVol: 0.45 },
          rain: { gain: null, node: null, enabled: false, userVol: 0.5 },
          fire: { gain: null, node: null, enabled: false, userVol: 0.4 },
          drone: { gain: null, nodes: [], enabled: false, userVol: 0.35 }
        };
      }

      init() {
        if (this.isAudioReady) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        for (let key in this.sounds) {
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(this.sounds[key].enabled ? this.sounds[key].userVol : 0, this.ctx.currentTime);
          g.connect(this.masterGain);
          this.sounds[key].gain = g;
        }

        this.isAudioReady = true;
      }

      setMasterVolume(val) {
        if (!this.isAudioReady) return;
        this.masterGain.gain.setTargetAtTime(val, this.ctx.currentTime, 0.05);
      }

      setTrackVolume(key, val) {
        this.sounds[key].userVol = val;
        if (!this.isAudioReady || !this.sounds[key].enabled) return;
        this.sounds[key].gain.gain.setTargetAtTime(val, this.ctx.currentTime, 0.05);
      }

      toggleTrack(key, isRunningTimer) {
        const item = this.sounds[key];
        item.enabled = !item.enabled;

        if (this.isAudioReady) {
          const targetVol = item.enabled ? item.userVol : 0;
          item.gain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.08);

          if (item.enabled && isRunningTimer) {
            this.startGenerator(key);
          } else if (!item.enabled) {
            this.stopGenerator(key);
          }
        }
        return item.enabled;
      }

      startActiveGenerators() {
        if (!this.isAudioReady) this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        for (let key in this.sounds) {
          if (this.sounds[key].enabled) {
            this.startGenerator(key);
            this.sounds[key].gain.gain.setTargetAtTime(this.sounds[key].userVol, this.ctx.currentTime, 0.1);
          }
        }
      }

      pauseGenerators() {
        if (!this.isAudioReady) return;
        for (let key in this.sounds) {
          if (key !== 'clock') {
            this.stopGenerator(key);
          }
        }
      }

      startGenerator(key) {
        if (key === 'brown' && !this.sounds.brown.node) this.createBrownian();
        if (key === 'rain' && !this.sounds.rain.node) this.createRain();
        if (key === 'fire' && !this.sounds.fire.node) this.createFire();
        if (key === 'drone' && this.sounds.drone.nodes.length === 0) this.createDrone();
      }

      stopGenerator(key) {
        if (key === 'drone') {
          this.sounds.drone.nodes.forEach(n => {
            try { n.stop(); n.disconnect(); } catch (e) {}
          });
          this.sounds.drone.nodes = [];
          return;
        }
        if (this.sounds[key] && this.sounds[key].node) {
          try {
            this.sounds[key].node.stop();
            this.sounds[key].node.disconnect();
          } catch(e) {}
          this.sounds[key].node = null;
        }
      }

      /* Synchronous Mechanical Tick/Tock */
      playTick(isEven) {
        if (!this.isAudioReady || !this.sounds.clock.enabled) return;

        const osc = this.ctx.createOscillator();
        const tickGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.frequency.setValueAtTime(isEven ? 1350 : 980, this.ctx.currentTime);
        osc.type = 'triangle';

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isEven ? 1420 : 1050, this.ctx.currentTime);
        filter.Q.setValueAtTime(10, this.ctx.currentTime);

        const now = this.ctx.currentTime;
        tickGain.gain.setValueAtTime(0.0001, now);
        tickGain.gain.exponentialRampToValueAtTime(0.4, now + 0.003);
        tickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.038);

        osc.connect(filter);
        filter.connect(tickGain);
        tickGain.connect(this.sounds.clock.gain);

        osc.start(now);
        osc.stop(now + 0.04);
      }

      createBrownian() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 3.5;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 350;

        whiteNoise.connect(lp);
        lp.connect(this.sounds.brown.gain);
        whiteNoise.start();
        this.sounds.brown.node = whiteNoise;
      }

      createRain() {
        const bufferSize = 2 * this.ctx.sampleRate;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;

        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          output[i] = (b0 + b1 + b2) * 0.22;
        }

        const rainSource = this.ctx.createBufferSource();
        rainSource.buffer = noiseBuffer;
        rainSource.loop = true;

        const band = this.ctx.createBiquadFilter();
        band.type = 'bandpass';
        band.frequency.value = 1100;
        band.Q.value = 0.8;

        rainSource.connect(band);
        band.connect(this.sounds.rain.gain);
        rainSource.start();
        this.sounds.rain.node = rainSource;
      }

      createFire() {
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const crackle = Math.random() < 0.002 ? (Math.random() * 2 - 1) * 0.9 : 0;
          const rustle = (Math.random() * 2 - 1) * 0.02;
          data[i] = crackle + rustle;
        }

        const src = this.ctx.createBufferSource();
        src.buffer = buffer;
        src.loop = true;

        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 2400;

        src.connect(lp);
        lp.connect(this.sounds.fire.gain);
        src.start();
        this.sounds.fire.node = src;
      }

      createDrone() {
        const freqs = [108, 216.2, 324.5];
        this.sounds.drone.nodes = [];

        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          subGain.gain.setValueAtTime(idx === 0 ? 0.35 : 0.12, this.ctx.currentTime);
          osc.connect(subGain);
          subGain.connect(this.sounds.drone.gain);
          osc.start();
          this.sounds.drone.nodes.push(osc);
        });
      }

      playCompletionChime() {
        if (!this.isAudioReady) return;
        const chimeNotes = [528, 660, 792, 1056];
        chimeNotes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;

          const startTime = this.ctx.currentTime + (i * 0.16);
          g.gain.setValueAtTime(0.001, startTime);
          g.gain.exponentialRampToValueAtTime(0.28, startTime + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, startTime + 2.2);

          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(startTime);
          osc.stop(startTime + 2.3);
        });
      }
    }

    /* Timer & UI Controller */
    const audio = new AudioEngine();

    const RADIUS = 140;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

    let totalDuration = 45 * 60;
    let remainingSeconds = totalDuration;
    let timerId = null;
    let isRunning = false;
    let tickFlip = false;

    // Elements
    const timeDisplay = document.getElementById('timeDisplay');
    const trackProgress = document.getElementById('trackProgress');
    const trackGlow = document.getElementById('trackGlow');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const playIcon = document.getElementById('playIcon');
    const resetBtn = document.getElementById('resetBtn');
    const liveTickDot = document.getElementById('liveTickDot');
    const sessionStatus = document.getElementById('sessionStatus');
    const presetBtns = document.querySelectorAll('.preset-btn');

    trackProgress.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;
    trackGlow.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;

    function updateProgressVisual() {
      const fraction = remainingSeconds / totalDuration;
      const offset = CIRCUMFERENCE * (1 - fraction);
      trackProgress.style.strokeDashoffset = offset;
      trackGlow.style.strokeDashoffset = offset;

      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      document.title = `${timeDisplay.textContent} • Ocean Focus`;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      audio.startActiveGenerators();
      isRunning = true;
      toggleText.textContent = 'Pause';
      sessionStatus.textContent = 'Focusing';
      playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

      timerId = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateProgressVisual();

          tickFlip = !tickFlip;
          audio.playTick(tickFlip);
          liveTickDot.classList.add('pulse');
          setTimeout(() => liveTickDot.classList.remove('pulse'), 120);
        } else {
          completeTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      audio.pauseGenerators();
      toggleText.textContent = 'Resume';
      sessionStatus.textContent = 'Paused';
      playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalDuration;
      toggleText.textContent = 'Start Focus';
      sessionStatus.textContent = 'Ready';
      updateProgressVisual();
    }

    function completeTimer() {
      pauseTimer();
      sessionStatus.textContent = 'Completed!';
      audio.playCompletionChime();
    }

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mins = parseInt(btn.dataset.minutes, 10);
        totalDuration = mins * 60;
        resetTimer();
      });
    });

    toggleBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleTimer();
      } else if (e.code === 'KeyR') {
        resetTimer();
      }
    });

    document.getElementById('masterVolume').addEventListener('input', (e) => {
      audio.setMasterVolume(parseFloat(e.target.value));
    });

    const soundKeys = ['clock', 'brown', 'rain', 'fire', 'drone'];
    soundKeys.forEach(key => {
      const toggle = document.getElementById(`toggle-${key}`);
      const vol = document.getElementById(`vol-${key}`);
      const card = document.getElementById(`card-${key}`);

      toggle.addEventListener('change', () => {
        const state = audio.toggleTrack(key, isRunning);
        card.classList.toggle('active', state);
      });

      vol.addEventListener('input', (e) => {
        audio.setTrackVolume(key, parseFloat(e.target.value));
      });
    });

    updateProgressVisual();
  </script>
</body>
